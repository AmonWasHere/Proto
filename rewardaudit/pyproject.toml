[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rewardaudit"
version = "0.0.1"
description = "Measuring whether LLM security verifiers can be trusted under adaptive adversarial code"
readme = "README.md"
requires-python = ">=3.11"
license = { text = "Apache-2.0" }
dependencies = []

[project.optional-dependencies]
cpg = ["tree-sitter>=0.24", "tree-sitter-java", "tree-sitter-python", "tree-sitter-c"]
dev = ["pytest>=8", "pyyaml"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
